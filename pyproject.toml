[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GeoKG"
version = "0.1.0"
description = "GeoNexus 领域知识图谱内容包：SDG 框架、国家/卫星/行政区划参考数据与摄入管道"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["geospatial", "knowledge-graph", "sdg", "geonode", "geonexus"]

# GeoKG 是纯内容层：图引擎与持久化由 SDK 提供，这里只依赖它，
# 不重复实现。依赖是单向的（geokg → geonexus），SDK 不反向导入本包。
dependencies = [
    "geonexus-sdk>=1.0.0",
]

[project.scripts]
# 管理工具入口：pip install 后即可用 `geokg` 命令
geokg = "geokg.cli:main"
# HTTP 管理面（独立端口）。fastapi/uvicorn 由 geonexus-sdk 带入，无需额外 extra。
geokg-api = "geokg.api:main"

[project.optional-dependencies]
# OSM 摄入路径（ingest_from_osm）所需
osm = ["httpx>=0.27"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 参考数据以数据文件形式随包分发（由 scripts/fetch_*.py 生成）。
# 缺了它，安装后 load_countries()/load_admin1() 会直接失败。
"geokg" = ["data/*.tsv", "data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# 与 GeoNexus-SDK 保持一致：本包内有大段数据字面量与中文注释，
# 长行不可避免，故不启用行宽限制。
# B008: FastAPI 把 Query()/Depends() 写在参数默认值里是官方惯用法。
ignore = ["E501", "SIM108", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
