name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: GeoKG (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GeoNexus SDK
        # GeoKG depends one-way on the SDK's graph primitives (geonexus.kg).
        # Until the SDK is published to PyPI, pull it from its repository
        # (its pyproject.toml sits at the repository root).
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/muyang/GeoNexus-SDK.git"

      - name: Install GeoKG
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests -q --tb=short

      - name: Ruff check
        run: ruff check src/ tests/ scripts/ --output-format=github

      - name: Management gate
        # 统一门禁：数据完整性 + 溯源强制 + 清单指纹一致性（全部离线）。
        # --drift 需联网，刻意不放在 CI 里，避免网络抖动导致假失败。
        run: |
          python -m geokg.cli verify
          python -m geokg.cli status --strict
